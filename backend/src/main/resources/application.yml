server:
  port: 8081
  error:
    # 让 4xx/5xx 的 message 出现在 JSON 里，便于前端展示明确原因（不包含任何凭据）。
    include-message: always

spring:
  # 认证完全由 JWT + SecurityFilterChain 承担，不需要 Spring Boot 自动配置的
  # 内存用户与随机初始密码（它只会在启动日志里打印一串无用口令，且不是本项目的登录入口）。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地 MySQL：数据库名 smartques 保持不变。
    url: "jdbc:mysql://127.0.0.1:3306/smartques?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    # 用户名可用 DB_USER 覆盖，默认 root；密码必须通过 DB_PASSWORD 提供。
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*.xml

# ============================================================
# 认证与鉴权配置说明（值全部来自环境变量，仓库内不出现真实密钥）
# ------------------------------------------------------------
# JWT_SECRET            HS256 签名密钥，至少 32 字节。未配置时进程生成一次性随机密钥并告警，
#                       重启后所有令牌立即失效；交付/部署环境必须显式配置。
# JWT_TTL_MINUTES       令牌有效期（分钟），默认 30，上限 120。
# CORS_ALLOWED_ORIGINS  允许跨域的前端源，逗号分隔，默认只放行本地 Vite dev server。
# ============================================================
